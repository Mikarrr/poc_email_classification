[project]
name = "email-classifier"
version = "0.1.0"
description = "AI agent that routes user messages to departments using a local Ollama LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2",
    "pydantic>=2.9",
    "pydantic-ai-slim[openai]>=2.54",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_classifier"]

# ── ruff ─────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "S",        # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

# ── mypy ─────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ── pytest ───────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
markers = [
    "live: calls a real LLM API (excluded from CI, run with -m live)",
]

[tool.coverage.run]
source = ["email_classifier"]
branch = true
